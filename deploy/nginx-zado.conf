# nginx devant la boutique Zado (copié par deploy/installer.sh dans /etc/nginx/sites-available/zado).
# Certbot y ajoute ensuite le HTTPS et la redirection http → https.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Photos de produits, pièces d'identité (jusqu'à 4 Mo, envoyées encodées) : marge suffisante
    client_max_body_size 15m;

    # Flux de rafraîchissement instantané (boutique et Zado Pro) : jamais mis en mémoire tampon
    location ~ ^/api/(admin/)?events$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
