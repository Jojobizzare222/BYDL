<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2D1B69">
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex, nofollow">
  <!-- Application « Kamwa Pro » : installable sur l'écran d'accueil de l'équipe et des fournisseurs -->
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/brand/pro-apple-touch.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kamwa Pro">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kamwa Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- Formes géométriques animées en arrière-plan (comme la boutique) -->
  <div class="bg-shapes" aria-hidden="true">
    <span class="shape ring r1"></span><span class="shape blob b1"></span><span class="shape spark k1"></span>
    <span class="shape square q1"></span><span class="shape blob b2"></span><span class="shape dots d1"></span><span class="shape spark k2"></span>
  </div>
  <!-- Barre latérale (cachée tant qu'on n'est pas connecté) -->
  <aside class="side" id="top" hidden>
    <a class="side-logo" href="#/tableau"><img src="/brand/logo-kamwa-clair.svg" alt="Kamwa" width="125" height="30"> espace pro</a>
    <nav class="side-nav">
      <a href="#/tableau" data-tab="tableau"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#squares-four-duotone"></use></svg>Tableau de bord</a>
      <p class="side-title" data-roles="admin orders">Ventes</p>
      <a href="#/commandes" data-tab="commandes" data-roles="admin orders"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#receipt-duotone"></use></svg>Commandes <span class="count" id="todoCount" hidden></span></a>
      <a href="#/clients" data-tab="clients" data-roles="admin"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#users-duotone"></use></svg>Clients</a>
      <a href="#/agences" data-tab="agences" data-roles="admin"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#storefront-duotone"></use></svg>Agences</a>
      <p class="side-title" data-roles="admin catalog supplier">Catalogue</p>
      <a href="#/produits" data-tab="produits" data-roles="admin catalog supplier"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#package-duotone"></use></svg><span class="lbl">Produits</span></a>
      <a href="#/fournisseur" data-tab="fournisseur" data-roles="supplier"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#receipt-duotone"></use></svg>Mes commandes</a>
      <p class="side-title" data-roles="admin">Gestion</p>
      <a href="#/finances" data-tab="finances" data-roles="admin"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#wallet-duotone"></use></svg>Finances</a>
      <p class="side-title" data-roles="admin">Équipe</p>
      <a href="#/equipe" data-tab="equipe" data-roles="admin"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#users-three-duotone"></use></svg>Équipe et fournisseurs</a>
      <a href="#/journal" data-tab="journal" data-roles="admin"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#list-bullets-duotone"></use></svg>Journal</a>
    </nav>
    <div class="side-foot">
      <span class="whoami" id="whoami"></span>
      <a class="side-btn" href="/" target="_blank" rel="noopener"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#arrow-square-out-bold"></use></svg>Voir la boutique</a>
      <a class="side-btn" href="#/mot-de-passe" data-roles="catalog orders supplier"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#key-bold"></use></svg>Mon mot de passe</a>
      <button class="side-btn" id="soundBtn" data-roles="admin orders" title="Sonnerie des nouvelles commandes"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#bell-slash-bold"></use></svg>Son coupé</button>
      <button class="side-btn" type="button" data-install-btn hidden onclick="window.kamwaApp && kamwaApp.install()"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#download-simple"></use></svg>Installer l'application</button>
      <button class="side-btn" id="logoutBtn"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#sign-out-bold"></use></svg>Quitter</button>
    </div>
  </aside>
  <div class="side-backdrop" id="sideBackdrop"></div>

  <div class="main">
    <header class="mobile-top">
      <button id="menuBtn" aria-label="Ouvrir le menu"><svg class="ico" aria-hidden="true"><use href="/icons.svg?v=4#list-bold"></use></svg></button>
      <img src="/brand/logo-kamwa-clair.svg" alt="Kamwa" width="108" height="26">
      <span class="count" id="todoCountMobile" hidden></span>
    </header>
    <main id="app"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="install-card" id="installCard" hidden></div>
  <script src="/js/pwa.js" defer></script>
  <script src="/admin/vendor/chart.umd.min.js" defer></script>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
