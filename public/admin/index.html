<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E3B2E">
  <meta name="robots" content="noindex, nofollow">
  <title>Kamwa Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="top" id="top" hidden>
    <div class="top-inner">
      <a class="logo" href="#/commandes">Kam<span>wa</span> <small>admin</small></a>
      <nav class="tabs">
        <a href="#/commandes" data-tab="commandes">Commandes <span class="count" id="todoCount" hidden></span></a>
        <a href="#/produits" data-tab="produits">Produits</a>
      </nav>
      <div class="top-actions">
        <button class="ghost" id="soundBtn" title="Sonnerie des nouvelles commandes">🔕 Son</button>
        <button class="ghost" id="logoutBtn">Quitter</button>
      </div>
    </div>
  </header>

  <main id="app"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/admin/admin.js" defer></script>
</body>
</html>
